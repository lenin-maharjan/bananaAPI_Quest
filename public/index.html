<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Set character encoding for the document -->
  <meta charset="UTF-8">
  <!-- Ensure mobile responsive layout rendering -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Title displayed on the browser tab -->
  <title>Banana Quest - Minimal Enterprise Edition</title>
  <!-- Link to external modular stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================================================== -->
  <!-- THEME 4: VIRTUAL IDENTITY UI (LOGIN CARD)            -->
  <!-- ==================================================== -->
  <div id="login-section" class="card">
    <h2>Virtual Identity Login</h2>
    <p class="subtitle">Enter credentials to establish a secure session</p>
    <div class="form-group">
      <label for="username">Username:</label>
      <input type="text" id="username" value="student" placeholder="Enter username">
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" id="password" value="banana123" placeholder="Enter password">
    </div>
    <button id="login-btn">Log In</button>
  </div>

  <!-- ==================================================== -->
  <!-- GAMEPLAY CARD (THEMES 2 & 3: INTEROPERABILITY & EVENTS) -->
  <!-- ==================================================== -->
  <div id="game-section" class="card hidden">
    <h2>Banana Quest</h2>
    <p class="subtitle">Authenticated as: <span id="current-user" class="badge-user"></span></p>

    <!-- THEME 3: EVENT-DRIVEN PROGRAMMING (TIMER DISPLAY) -->
    <div id="timer-display" class="timer-badge">Time Left: 45s</div>

    <!-- THEME 2: INTEROPERABILITY (PUZZLE FETCHED FROM API) -->
    <img id="puzzle-img" src="" alt="Banana Puzzle Image" class="hidden">

    <button id="fetch-puzzle-btn">Load New Puzzle</button>

    <div id="guess-container" class="hidden" style="margin-top: 15px;">
      <div class="form-group">
        <label for="guess-input">Enter Answer (0-9):</label>
        <input type="number" id="guess-input" min="0" max="9" placeholder="Enter digit">
      </div>
      <button id="submit-guess-btn">Submit Answer</button>
    </div>

    <!-- Feedback display -->
    <div id="message-box"></div>

    <!-- Logout button to clear virtual identity -->
    <button id="logout-btn" style="background:#e74c3c; color:white; margin-top:20px;">Log Out</button>
  </div>

  <!-- Link to external modular JavaScript file containing event-driven game logic -->
  <script src="js/app.js"></script>
</body>
</html>
